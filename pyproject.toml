[project]
name = "offbook"
version = "0.1.0"
description = "Line-rehearsal partner: photograph a script, pick your part, and it voices everyone else"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "pillow>=11",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
offbook = "offbook.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/offbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
